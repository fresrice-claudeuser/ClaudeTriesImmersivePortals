// Used by the "inspect" workflow:  gradle -q inspect -PinspectClasses="..."
//
// Asks the REAL Minecraft jar (the exact one the mod compiles against) what it contains, so the port is
// driven by facts instead of memory.
//
// If inspect-request.txt exists in the repo root it is used (one request per line, '#' starts a comment);
// otherwise the requests come from -PinspectClasses (space separated). Request forms:
//   ServerLevel                       bare name: members of every class with that simple name
//   net.minecraft.server.level.ServerLevel   fully qualified (use for inner classes: Outer$Inner)
//   ServerLevel:getWorldBorder|close  only members matching the regex (class headers are always shown)
//   ~Permission                       list net.minecraft / com.mojang class names containing the text
//   MinecraftServer@src:createLevels  decompiled SOURCE of methods matching the regex (runs genSources, slow once)
// This file is only applied when -PinspectClasses is given (see build.gradle), so it can never break a normal build.
tasks.register('inspect') {
    def requestFile = new File(project.rootDir, 'inspect-request.txt')
    List<String> entries = []
    if (requestFile.exists()) {
        requestFile.readLines().each { raw ->
            String line = raw.trim()
            if (line && !line.startsWith('#')) {
                entries << line
            }
        }
    } else {
        project.property('inspectClasses').toString().trim().split(/\s+/).each { if (it) { entries << it } }
    }
    // The workflow box carries a default filter; it must not leak into a request file (entries there say their own filter).
    String defaultMembers = requestFile.exists() ? '' : (project.findProperty('inspectMembers') ?: '').toString().trim()
    if (entries.any { it.contains('@src:') }) {
        dependsOn 'genSources'
    }

    doLast {
        def jars = project.sourceSets.main.compileClasspath.files.findAll { it.isFile() && it.name.endsWith('.jar') }
        String classpath = project.sourceSets.main.compileClasspath.asPath
        String javap = new File(System.getProperty('java.home'), 'bin/javap').absolutePath

        // dotted class name -> jar it lives in
        Map<String, String> index = [:]
        jars.each { jar ->
            def zip = new java.util.zip.ZipFile(jar)
            try {
                java.util.Collections.list(zip.entries()).each { entry ->
                    String entryName = entry.name
                    if (entryName.endsWith('.class')) {
                        index[entryName.substring(0, entryName.length() - 6).replace('/', '.')] = jar.name
                    }
                }
            } finally {
                zip.close()
            }
        }
        println "# indexed ${index.size()} classes from ${jars.size()} jars"

        def resolve = { String name ->
            List<String> matches
            if (name.contains('.')) {
                matches = index.containsKey(name) ? [name] : []
            } else {
                matches = index.keySet().findAll { it.endsWith('.' + name) && !it.contains('$') }.sort()
            }
            return matches
        }

        // methods whose declaration line (exactly 4 spaces of indent) matches `regex`, with their bodies
        def extractMethods = { String text, String regex ->
            List<String> lines = text.readLines()
            def pattern = java.util.regex.Pattern.compile('\\b(' + regex + ')\\s*\\(')
            def leading = { String s ->
                int n = 0
                while (n < s.length() && (s[n] == ' ' || s[n] == '\t')) {
                    n++
                }
                return n
            }
            // class members sit at the smallest indent used anywhere in the file (3 spaces, 4 spaces, or one tab)
            int memberLevel = 0
            lines.each { String l ->
                if (l.trim()) {
                    int n = leading(l)
                    if (n > 0 && (memberLevel == 0 || n < memberLevel)) {
                        memberLevel = n
                    }
                }
            }
            List<String> blocks = []
            int i = 0
            while (i < lines.size()) {
                String line = lines[i]
                String trimmed = line.trim()
                boolean memberIndent = memberLevel > 0 && leading(line) == memberLevel
                boolean isDeclaration = memberIndent && !trimmed.startsWith('//') && !trimmed.startsWith('*') &&
                        !trimmed.startsWith('@') && !trimmed.startsWith('return ') && pattern.matcher(line).find()
                if (isDeclaration) {
                    int j = i
                    int depth = 0
                    boolean opened = false
                    List<String> block = []
                    while (j < lines.size()) {
                        String current = lines[j]
                        block << current
                        current.each { ch ->
                            if (ch == '{') {
                                depth++
                                opened = true
                            } else if (ch == '}') {
                                depth--
                            }
                        }
                        if (opened && depth <= 0) {
                            break
                        }
                        if (!opened && current.trim().endsWith(';')) {
                            break
                        }
                        j++
                    }
                    blocks << block.join('\n')
                    i = j + 1
                } else {
                    i++
                }
            }
            return blocks
        }

        def minecraftJar = jars.find { it.name.startsWith('minecraft-merged') }
        File sourcesJar = minecraftJar == null ? null :
                new File(minecraftJar.parentFile, minecraftJar.name.replaceAll(/\.jar$/, '-sources.jar'))

        entries.each { String entry ->
            println ''
            println "################ ${entry}"

            // ---- ~text : search class names ----
            if (entry.startsWith('~')) {
                String needle = entry.substring(1).toLowerCase()
                def hits = index.keySet().findAll {
                    it.toLowerCase().contains(needle) && (it.startsWith('net.minecraft.') || it.startsWith('com.mojang.'))
                }.sort()
                println(hits ? hits.join('\n') : '(no class name contains that text)')
                return
            }

            // ---- parse Name / Name:memberRegex / Name@src:methodRegex ----
            String className = entry
            String memberText = defaultMembers
            String srcRegex = null
            if (entry.contains('@src:')) {
                def parts = entry.split('@src:', 2)
                className = parts[0]
                srcRegex = parts[1]
            } else if (entry.contains(':')) {
                def parts = entry.split(':', 2)
                className = parts[0]
                memberText = parts[1]
            }
            def memberPattern = memberText ? java.util.regex.Pattern.compile('(?i)' + memberText) : null

            List<String> matches = resolve(className)
            if (matches.isEmpty()) {
                println '(class not found in the Minecraft / Fabric jars)'
                return
            }
            if (matches.size() > 8) {
                println "# ${matches.size()} matches, showing the first 8: use a fully qualified name to pick one"
                matches = matches.take(8)
            }

            matches.each { String fq ->
                println "=== ${fq}   [${index[fq]}]"

                // ---- decompiled source of selected methods ----
                if (srcRegex != null) {
                    if (sourcesJar == null || !sourcesJar.exists()) {
                        println "(no decompiled sources found next to the Minecraft jar: ${sourcesJar})"
                        return
                    }
                    def zip = new java.util.zip.ZipFile(sourcesJar)
                    try {
                        String outer = fq.contains('$') ? fq.substring(0, fq.indexOf('$')) : fq
                        def zipEntry = zip.getEntry(outer.replace('.', '/') + '.java')
                        if (zipEntry == null) {
                            println "(no decompiled source entry for ${outer})"
                        } else {
                            String text = zip.getInputStream(zipEntry).getText('UTF-8')
                            def blocks = extractMethods(text, srcRegex)
                            println(blocks ? blocks.join('\n\n') : "(no method matching '${srcRegex}' at class level)")
                        }
                    } finally {
                        zip.close()
                    }
                    return
                }

                // ---- javap member listing ----
                def inner = index.keySet().findAll { it.startsWith(fq + '$') }.sort()
                if (inner) {
                    println '# inner classes: ' + inner.collect { it.substring(fq.length()) }.join(' ')
                }
                def process = new ProcessBuilder(javap, '-p', '-cp', classpath, fq).redirectErrorStream(true).start()
                String text = process.inputStream.getText('UTF-8')
                process.waitFor()
                text.readLines().each { String line ->
                    if (line.startsWith('Compiled from')) {
                        return
                    }
                    boolean isHeader = line.endsWith('{') || line.equals('}')
                    if (memberPattern == null || isHeader || memberPattern.matcher(line).find()) {
                        println line
                    }
                }
            }
        }
    }
}
