# ============================================================================
#  Everything that changes with the Minecraft version lives in this file.
#  Do not hand-edit the "Minecraft target" block; run:
#      python tools/bump_mc.py 26.1
#  (it copies versions/<preset>.properties in and flips the Loom plugin id).
#  See docs/BUMPING.md.
# ============================================================================
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# --- This mod ---------------------------------------------------------------
mod_id=claude_immersive_portals
mod_name=Immersive Portals (Claude port)
mod_version=0.1.0-alpha.1
maven_group=dev.claudeportals
archives_base_name=claude-immersive-portals

# --- Build tooling (changes rarely) -----------------------------------------
gradle_version=9.5.1
loom_version=1.17.21

# --- Minecraft target (managed by tools/bump_mc.py) --------------------------
mc_preset=1.21.11
minecraft_version=1.21.11
minecraft_dependency=1.21.11
minecraft_obfuscated=true
java_version=21
fabric_loader_version=0.19.5
fabric_api_version=0.141.4+1.21.11
modmenu_version=17.0.0

# --- Dev-runtime mods for ./gradlew runClient (Iris hard-requires Sodium) -----
dev_runtime=true
sodium_version=mc1.21.11-0.8.7-fabric
iris_version=1.10.7+1.21.11-fabric
